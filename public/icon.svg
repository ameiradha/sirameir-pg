<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyberGlow)" stroke-width="6" opacity="0.6" />
  
  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Central Emblem: Glowing Gamepad & Play Icon -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Gamepad Body -->
    <path d="M -110,-40 C -140,-40 -150,-10 -140,40 C -135,65 -115,100 -85,90 C -60,80 -50,55 -30,55 L 30,55 C 50,55 60,80 85,90 C 115,100 135,65 140,40 C 150,-10 140,-40 110,-40 Z" fill="#1e293b" stroke="url(#cyberGlow)" stroke-width="8" filter="url(#glow)" />

    <!-- D-Pad Left -->
    <path d="M -90,-12 L -74,-12 L -74,-28 L -62,-28 L -62,-12 L -46,-12 L -46,0 L -62,0 L -62,16 L -74,16 L -74,0 L -90,0 Z" fill="#38bdf8" />
    
    <!-- Action Buttons Right (Diamond pattern) -->
    <circle cx="68" cy="-18" r="6" fill="#f43f5e" />
    <circle cx="86" cy="0" r="6" fill="#eab308" />
    <circle cx="68" cy="18" r="6" fill="#10b981" />
    <circle cx="50" cy="0" r="6" fill="#6366f1" />

    <!-- Center Play/Rocket Indicator -->
    <polygon points="-6,-10 14,0 -6,10" fill="url(#accentGrad)" />
  </g>

  <!-- Top Sparks / Star -->
  <path d="M 256,60 L 262,80 L 282,86 L 262,92 L 256,112 L 250,92 L 230,86 L 250,80 Z" fill="#38bdf8" opacity="0.9" />
  <circle cx="370" cy="110" r="4" fill="#a855f7" />
  <circle cx="140" cy="120" r="3" fill="#f59e0b" />

  <!-- Typography: SIR AMEIR & PLAYGROUND -->
  <text x="256" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="4">SIR AMEIR</text>
  <text x="256" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="3">PLAYGROUND</text>
</svg>
